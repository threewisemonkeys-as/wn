name: Build and deploy forest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3"

      # Our fork of Forester 5.0 (https://github.com/threewisemonkeys-as/forester, branch wn)
      - name: Install Forester
        run: opam pin add -y forester git+https://github.com/threewisemonkeys-as/forester.git#wn

      - name: Build forest
        run: opam exec -- forester build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: output/wn

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
